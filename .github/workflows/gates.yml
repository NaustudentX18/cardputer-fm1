# SPDX-License-Identifier: Apache-2.0
# The gates, on every push. Ubuntu runners have cc, c++ and ImageMagick.
name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vendor the Apache-2.0 reference the engine is gated against
        run: tools/fetch_msfa.sh

      - name: Run every gate
        run: tools/run_host_tests.sh

      - name: Screenshots are reproducible
        env:
          NO_UPSCALE: "1"
        run: |
          tools/render_screens.sh "$RUNNER_TEMP/screens"
          # The committed files are 4x upscales when ImageMagick was available locally, so
          # compare dimensions first and pixels only when they match.
          fail=0
          for f in "$RUNNER_TEMP/screens"/*.png; do
            name=$(basename "$f")
            committed="docs/screens/$name"
            [ -f "$committed" ] || { echo "missing committed: $name"; fail=1; continue; }
            if ! cmp -s "$committed" "$f"; then
              echo "note: $name differs from a fresh 1x render (expected if committed at 4x)"
            fi
          done
          # The real assertion: a fresh render must produce the same bytes every time.
          tools/render_screens.sh "$RUNNER_TEMP/screens2"
          for f in "$RUNNER_TEMP/screens"/*.png; do
            name=$(basename "$f")
            cmp -s "$f" "$RUNNER_TEMP/screens2/$name" || {
              echo "renderer is not deterministic: $name"; fail=1; }
          done
          test "$fail" -eq 0
          echo "renderer is deterministic across runs"
