# SPDX-License-Identifier: Apache-2.0
# Publishes docs/ to GitHub Pages. The landing page is static: no build step, because the
# screenshots in docs/screens are produced by the C renderer and committed.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the page's own assets resolve
        run: |
          set -e
          cd docs
          # every src/href that is not a URL must exist in the tree
          missing=0
          for f in $(grep -oE '(src|href)="[^"]+"' index.html \
                     | sed -E 's/.*="//; s/"$//' \
                     | grep -vE '^(https?:|#|mailto:)' | sort -u); do
            if [ ! -f "$f" ]; then
              echo "missing: $f"
              missing=1
            fi
          done
          test "$missing" -eq 0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
